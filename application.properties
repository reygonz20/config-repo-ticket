# ==========================================
# CONFIGURACION COMUN DE LOS MICROSERVICIOS
# ==========================================

# EUREKA
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# BASE DE DATOS MYSQL COMPARTIDA
spring.datasource.url=jdbc:mysql://localhost:3306/db_tickets?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# MENSAJES COMPARTIDOS
messages.error-database=No hay conexion a la BD.
messages.error-product-not-found=Producto no encontrado, vuelva a intentar otra vez.